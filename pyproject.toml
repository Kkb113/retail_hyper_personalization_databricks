[build-system]
requires = ["setuptools==75.8.2", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-hp-azure-databricks"
version = "0.1.0"
description = "Azure Databricks retail hyper-personalization POC"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migration_assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests/azure_databricks"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "migration_assets"]
